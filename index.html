<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- GA4タグ -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3GTF65RTPP"></script>
<script>
window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-3GTF65RTPP');
</script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
var userAgent = navigator.userAgent;
var os = "other";
var redirectUrl = "";

if (/iPhone|iPad|iPod/.test(userAgent)) {
  os = "iOS";
  redirectUrl = "https://apps.apple.com/jp/app/coleman-japan-コールマン-ジャパン-公式アプリ/id6742218671";
} else if (/Android/.test(userAgent)) {
  os = "Android";
  redirectUrl = "https://play.google.com./store/apps/details?id=jp.coleman.members";
} else {
  redirectUrl = "https://www.coleman.co.jp/";
}

// NFCタップイベント送信
gtag('event', 'nfc_tap', {
  device_os: os
});

// 計測を確実にするため少し待ってから遷移
setTimeout(function() {
  window.location.href = redirectUrl;
}, 500);
</script>

</head>
<body>
</body>
</html>
