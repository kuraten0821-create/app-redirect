<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>アプリストアへ移動中…</title>

 //G4A Tag
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GTF65RTPP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-3GTF65RTPP', { send_page_view: false });
  </script>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var rawStore = (params.get('store') || '').trim();
      var normalized = rawStore.toLowerCase();
      var ALLOWED = { kurashiki: 'Kurashiki', gotemba: 'Gotemba', shisui: 'Shisui' };
      var LOCATION = ALLOWED[normalized] || (rawStore || 'unknown');

      var DEBUG = params.get('debug') === '1';

      var APP_STORE_URL = "https://apps.apple.com/jp/app/coleman-japan-%E3%82%B3%E3%83%BC%E3%83%AB%E3%83%9E%E3%83%B3-%E3%82%B8%E3%83%A3%E3%83%91%E3%83%B3-%E5%85%AC%E5%BC%8F%E3%82%A2%E3%83%97%E3%83%AA/id6742218671";
      var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=jp.coleman.members";
      var PLAY_UTM = "utm_source=nfc&utm_medium=card&utm_campaign=app_invite";
      var WEB_URL  = "https://www.coleman.co.jp/?utm_source=nfc&utm_medium=card&utm_campaign=app_invite";

      var LABELS = { ios: "app_store", android: "google_play", other: "web" };
      var EVENT_TIMEOUT_MS = 1500;
      var HARD_REDIRECT_MS = DEBUG ? 2500 : 2000;

      function os() {
        var ua = navigator.userAgent || "";
        if (/iPhone|iPad|iPod/.test(ua)) return "iOS";
        if (/Android/.test(ua)) return "Android";
        return "other";
      }
      function dest(o) {
        if (o === "iOS") return { url: APP_STORE_URL, store: LABELS.ios };
        if (o === "Android") {
          var sep = PLAY_STORE_URL.includes("?") ? "&" : "?";
          return { url: PLAY_STORE_URL + sep + PLAY_UTM, store: LABELS.android };
        }
        return { url: WEB_URL, store: LABELS.other };
      }

      var o = os(), d = dest(o), redirected = false;
      function go(reason) {
        if (redirected) return; redirected = true;
        try {
          if (typeof gtag === 'function') {
            gtag('event', 'redirect', {
              device_os: o,
              store: d.store,
              location: LOCATION,
              redirect_reason: reason,
              transport_type: 'beacon',
              debug_mode: DEBUG || undefined
            });
          }
        } catch (e) {}
        window.location.replace(d.url);
      }

      function run() {
        if (typeof gtag === 'function') {
          gtag('event', 'nfc_tap', {
            device_os: o,
            store: d.store,
            location: LOCATION,
            transport_type: 'beacon',
            debug_mode: DEBUG || undefined,
            event_callback: function(){ go('callback'); },
            event_timeout: EVENT_TIMEOUT_MS
          });
          setTimeout(function(){ go('timeout'); }, HARD_REDIRECT_MS);
        } else {
          go('no_gtag');
        }
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') run();
      else document.addEventListener('DOMContentLoaded', run);
    })();
  </script>
</body>
</html>
