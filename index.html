<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>アプリストアへ移動中…</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GTF65RTPP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-3GTF65RTPP', { send_page_view: false });
  </script>

  <style>
    :root { color-scheme: light dark; }
    body {
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto,
        "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }
    .wrap {
      min-height: 100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      background:#fafafa;
    }
    @media (prefers-color-scheme: dark){ .wrap{ background:#111; } }
    .panel {
      max-width:560px;
      width:100%;
      background:#fff;
      border-radius:16px;
      padding:24px;
      box-shadow:0 6px 20px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark){
      .panel{ background:#181818; color:#f5f5f5; }
    }
    .title { font-size:18px; font-weight:700; margin:0 0 8px; }
    .desc  { font-size:14px; opacity:.85; margin:0 0 8px; }
    .small { font-size:12px; opacity:.7; }
    .debug {
      margin-top:16px;
      font-size:12px;
      text-align:left;
      word-break:break-all;
      background:#f0f0f0;
      padding:12px;
      border-radius:8px;
    }
  </style>
</head>

<body>
<div style="
position:fixed;
top:0;
left:0;
right:0;
padding:12px;
background:#ff0000;
color:#ffffff;
font-weight:bold;
text-align:center;
z-index:99999;">
TEST BRANCH 2026/06/11
</div>

<div class="wrap">
  <div class="panel">
    <p class="title">アプリストアへ移動しています…</p>
    <p class="desc">数秒待っても自動で移動しない場合は、端末の戻るボタンでお戻りください。</p>
    <p class="small">通信状況により最大1〜2秒かかる場合があります。</p>

    <!-- デバッグ表示 -->
    <div id="debugArea" class="debug" style="display:none;"></div>
  </div>
</div>

<script>
(function () {

  /* ===== 基本情報 ===== */
  var pageOpenedAt = Date.now();

  var params   = new URLSearchParams(location.search);
  var rawStore = (params.get('store') || '').trim();
  var storeKey = rawStore.toLowerCase();
  var DEBUG    = params.get('debug') === '1';

  var STORES = {
    nagareyama:'Nagareyama', rinku:'Rinku', sano:'Sano', gotemba:'Gotemba',
    toki:'Toki', karuizawa:'Karuizawa', tosu:'Tosu',
    shisui:'Shisui', akishima:'Akishima', nagashima:'Nagashima'
  };
  var LOCATION = STORES[storeKey] || (rawStore || 'unknown');

  /* ===== OS判定 ===== */
  function detectOS(){
    var ua = navigator.userAgent || "";
    if (/iPhone|iPad|iPod/.test(ua)) return "iOS";
    if (/Android/.test(ua)) return "Android";
    return "other";
  }

  var context = { os: detectOS() };

  /* ===== device_id ===== */
  function getDeviceId(){
    var id = localStorage.getItem('device_id');
    if (!id) {
      id = Math.random().toString(36).substring(2) + Date.now();
      localStorage.setItem('device_id', id);
    }
    return id;
  }

  var deviceId = getDeviceId();

  /* ===== 再訪フラグ ===== */
  var repeated = !!sessionStorage.getItem('nfc_seen');
  sessionStorage.setItem('nfc_seen', '1');

  /* ===== イベント送信 ===== */
  window.addEventListener('DOMContentLoaded', function () {
    var elapsedMs = Date.now() - pageOpenedAt;

    var payload = {
      device_os: context.os,
      location: LOCATION,
      elapsed_ms: Number(elapsedMs),
      repeated: Number(repeated ? 1 : 0),
      device_id: String(deviceId),
      is_debug: DEBUG ? 1 : 0
    };

    // console出力
    console.log("GA送信", payload);

    // 画面表示（デバッグ時）
    if (DEBUG) {
      var el = document.getElementById('debugArea');
      el.style.display = 'block';
      el.innerText = JSON.stringify(payload, null, 2);
    }

    // GA送信
    if (typeof gtag === 'function') {
      gtag('event', 'nfc_tap', payload);
    }
  });

  /* ===== 遷移先 ===== */
  var APP_STORE_URL  = "https://apps.apple.com/jp/app/coleman-japan/id6742218671";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=jp.coleman.members&utm_source=nfc&utm_medium=card";
  var WEB_URL        = "https://www.coleman.co.jp/";

  var destUrl = WEB_URL;
  if (context.os === "iOS") destUrl = APP_STORE_URL;
  if (context.os === "Android") destUrl = PLAY_STORE_URL;

  /* ===== リダイレクト（デバッグ時は停止） ===== */
 if (!DEBUG) {
  console.log("TEST BRANCH - redirect disabled");
}

})();
</script>
</body>
</html>
